# fly.toml app configuration file generated for nolerstores-xwlgba on 2026-07-27T13:48:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nolerstores-xwlgba'
primary_region = 'iad'

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[services]]
  internal_port = 4000
  protocol = 'tcp'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 100

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
